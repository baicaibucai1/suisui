[package]
name = "suisui"
version = "0.1.0"
description = "碎碎 —— 个人无关紧要的文字"
authors = ["baicaibucai1"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# 坚果云的 WebDAV 要从这里发 —— 浏览器里过不去 CORS（见 src/main.rs 的说明）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "macos-system-configuration"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
